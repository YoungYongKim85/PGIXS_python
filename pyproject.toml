[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgixs-python"
version = "0.2.4"
description = "Grazing-incidence and transmission X-ray scattering data reduction for the PAL 3C beamline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Young Yong Kim", email = "kimyy@postech.ac.kr" },
]
keywords = ["GIXS", "GIWAXS", "SAXS", "synchrotron", "X-ray scattering", "data reduction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy==1.23.5",
  "scipy==1.13.1",
  "matplotlib==3.8.2",
  "h5py==3.10.0",
  "tifffile==2024.2.12",
  "PySide6==6.11.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgixs_python*"]

[project.urls]
Homepage = "https://github.com/YoungYongKim85/PGIXS_python"
Repository = "https://github.com/YoungYongKim85/PGIXS_python"
Issues = "https://github.com/YoungYongKim85/PGIXS_python/issues"
"MATLAB version" = "https://github.com/YoungYongKim85/PGIXS_matlab"
