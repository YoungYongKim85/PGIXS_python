[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgixs-python"
version = "0.2.1"
description = "Python port of PGIXS Tab1 raw-data processing"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.23.5",
  "scipy==1.13.1",
  "matplotlib==3.8.2",
  "h5py==3.10.0",
  "tifffile==2024.2.12",
  "PySide6==6.11.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgixs_python*"]
