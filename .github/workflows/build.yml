name: Build desktop app

# Builds the PySide6 desktop app (packaging/pgixs.spec) for Windows,
# macOS, and Linux. PyInstaller never cross-compiles, so this runs the
# same build once per OS runner instead of trying to build all three from
# one machine.
#
# Triggers on a version tag (v*, e.g. v0.1.0) to also publish a GitHub
# Release with all three builds attached, or manually via
# workflow_dispatch for a test build without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: PGIXS-windows
          - os: macos-latest
            asset_name: PGIXS-macos
          - os: ubuntu-latest
            asset_name: PGIXS-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        # PySide6 (a full Qt runtime) needs these system libraries present
        # to even start on a bare Ubuntu runner -- without them the frozen
        # binary fails at launch with missing .so errors, not at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/pgixs.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path packaging/dist/PGIXS -DestinationPath ${{ matrix.asset_name }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # Zip the .app bundle (not the loose COLLECT folder) so Finder/the
        # Dock treat it as one double-clickable application on unzip.
        run: ditto -c -k --sequesterRsrc --keepParent packaging/dist/PGIXS.app ${{ matrix.asset_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C packaging/dist -czf ${{ matrix.asset_name }}.tar.gz PGIXS

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: ignore
          # Only the release job below (same run) or a manual test build
          # needs these; at the 90-day default, ~350 MB per run filled the
          # artifact storage quota and v0.3.0's first build could not upload.
          retention-days: 5

  manual:
    # The .docx manual is generated, not committed -- Word rewrites its
    # table-of-contents field the moment anyone opens the file, so a tracked
    # copy showed up as an uncommitted change over and over. Building it here
    # also guarantees the manual attached to a release matches that release's
    # Markdown source. docs/desktop_manual_ko.md is the source of truth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build the manual
        working-directory: docs/tools
        run: |
          npm install --no-audit --no-fund
          npm run manual

      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: docs/desktop_manual_ko.docx
          retention-days: 5

  release:
    needs: [build, manual]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `gh release create --generate-notes` shells out to `git` itself
      # (to work out the commit range for the auto-generated notes) --
      # without a checkout, there's no .git here at all and it fails with
      # "fatal: not a git repository" before ever touching the artifacts.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # packaging/release_notes.md carries the hand-written part of the body
        # (notably the "results change in this version" warning); gh appends
        # its auto-generated commit list underneath. Update that file before
        # tagging a release.
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*
          --title "${{ github.ref_name }}"
          --notes-file packaging/release_notes.md
          --generate-notes
